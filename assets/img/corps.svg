<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A labelled body: la tête, le cou, l'épaule, le bras, le dos, le ventre, la main, le doigt, la jambe, le genou and le pied. Below, the phrase they all feed: j'ai mal au dos, à la tête, aux jambes.">
  <style>
    .lbl  { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .en   { font-size: 11px; font-style: italic; fill: #64748b; }
    .lead { stroke: #dc2626; stroke-width: 1.6; fill: none; }
    .dot  { fill: #dc2626; }
  </style>

  <rect width="640" height="560" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Le corps</text>

  <!-- legs -->
  <path d="M296,286 L282,470" stroke="#fde3c8" stroke-width="30" stroke-linecap="round"/>
  <path d="M344,286 L358,470" stroke="#fde3c8" stroke-width="30" stroke-linecap="round"/>
  <ellipse cx="274" cy="486" rx="22" ry="11" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <ellipse cx="366" cy="486" rx="22" ry="11" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- knees, so the label has something to point at -->
  <circle cx="290" cy="376" r="10" fill="#fbd3ae" stroke="#e2b48c" stroke-width="1.5"/>
  <circle cx="350" cy="376" r="10" fill="#fbd3ae" stroke="#e2b48c" stroke-width="1.5"/>

  <!-- arms -->
  <path d="M264,138 L214,296" stroke="#fde3c8" stroke-width="24" stroke-linecap="round"/>
  <path d="M376,138 L426,296" stroke="#fde3c8" stroke-width="24" stroke-linecap="round"/>
  <ellipse cx="209" cy="314" rx="14" ry="19" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <ellipse cx="431" cy="314" rx="14" ry="19" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <g stroke="#e2b48c" stroke-width="1.4" stroke-linecap="round">
    <path d="M424,330 L421,344"/><path d="M431,332 L431,347"/><path d="M438,330 L441,344"/>
  </g>

  <!-- torso -->
  <path d="M262,140 Q264,126 284,122 L356,122 Q376,126 378,140 L368,236 Q368,272 356,292 L284,292 Q272,272 272,236 Z"
        fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- neck -->
  <rect x="306" y="98" width="28" height="28" rx="6" fill="#fbd3ae" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- head -->
  <ellipse cx="320" cy="72" rx="34" ry="40" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <path d="M286,64 Q284,26 320,26 Q356,26 354,64 Q348,42 330,36 Q306,48 286,64 Z" fill="#a06a3c"/>
  <circle cx="308" cy="74" r="3" fill="#5b3a1e"/><circle cx="332" cy="74" r="3" fill="#5b3a1e"/>
  <path d="M310,92 Q320,98 330,92" stroke="#c96b6b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ── left-hand labels ─────────────────────────────────────────── -->
  <g text-anchor="end">
    <text class="lbl" x="196" y="70">la tête</text>
    <text class="en"  x="196" y="85">the head</text>
    <path class="lead" d="M202,66 L288,62"/><circle class="dot" cx="288" cy="62" r="3"/>

    <text class="lbl" x="196" y="130">le cou</text>
    <text class="en"  x="196" y="145">the neck</text>
    <path class="lead" d="M202,126 L306,112"/><circle class="dot" cx="306" cy="112" r="3"/>

    <text class="lbl" x="196" y="190">l’épaule</text>
    <text class="en"  x="196" y="205">the shoulder</text>
    <path class="lead" d="M202,186 L270,134"/><circle class="dot" cx="270" cy="134" r="3"/>

    <text class="lbl" x="196" y="250">le bras</text>
    <text class="en"  x="196" y="265">the arm</text>
    <path class="lead" d="M202,246 L240,222"/><circle class="dot" cx="240" cy="222" r="3"/>

    <text class="lbl" x="196" y="400">la jambe</text>
    <text class="en"  x="196" y="415">the leg</text>
    <path class="lead" d="M202,396 L286,414"/><circle class="dot" cx="286" cy="414" r="3"/>

    <text class="lbl" x="196" y="478">le pied</text>
    <text class="en"  x="196" y="493">the foot</text>
    <path class="lead" d="M202,474 L254,486"/><circle class="dot" cx="254" cy="486" r="3"/>
  </g>

  <!-- ── right-hand labels ────────────────────────────────────────── -->
  <g text-anchor="start">
    <text class="lbl" x="452" y="140">le dos</text>
    <text class="en"  x="452" y="155">the back</text>
    <path class="lead" d="M446,136 L374,170"/><circle class="dot" cx="374" cy="170" r="3"/>

    <text class="lbl" x="452" y="212">le ventre</text>
    <text class="en"  x="452" y="227">the stomach, the belly</text>
    <path class="lead" d="M446,208 L344,246"/><circle class="dot" cx="344" cy="246" r="3"/>

    <text class="lbl" x="474" y="278">la main</text>
    <text class="en"  x="474" y="293">the hand</text>
    <path class="lead" d="M468,274 L446,306"/><circle class="dot" cx="448" cy="310" r="3"/>

    <text class="lbl" x="474" y="340">le doigt</text>
    <text class="en"  x="474" y="355">the finger</text>
    <path class="lead" d="M468,336 L441,343"/><circle class="dot" cx="440" cy="342" r="3"/>

    <text class="lbl" x="452" y="392">le genou</text>
    <text class="en"  x="452" y="407">the knee — des genoux</text>
    <path class="lead" d="M446,388 L360,378"/><circle class="dot" cx="360" cy="378" r="3"/>
  </g>

  <!-- what the whole list is for -->
  <rect x="120" y="512" width="400" height="32" rx="16" fill="#fef2f2"/>
  <text x="320" y="533" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">j’ai mal au dos · à la tête · aux jambes</text>
</svg>

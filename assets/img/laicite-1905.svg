<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A schematic showing where the 1905 law of separation of church and state does not apply. Mainland France is drawn as a stylised hexagon, shaded blue, with the 1905 law applying everywhere in it except a small amber area at the north-east corner: Alsace-Moselle, which was German in 1905 and still runs under the Concordat of 1801, where the state pays the clergy. Corsica is shown below the hexagon, under the 1905 law. To the right, a separate amber box for Guyane, 7000 kilometres away in South America, where an 1828 royal ordinance still stands and the collectivite pays the Catholic clergy. A caption notes: one exception in the Hexagone, one outre-mer.">
  <style>
    .t   { font-size: 17px; font-weight: 800; fill: #0f172a; }
    .st  { font-size: 11px; font-style: italic; fill: #64748b; }
    .zn  { font-size: 12px; font-weight: 800; fill: #0f172a; }
    .zs  { font-size: 10px; fill: #475569; }
    .tag { font-size: 9.5px; font-weight: 700; fill: #b45309; }
    .ok  { font-size: 10px; font-weight: 700; fill: #1d4ed8; }
    .ft  { font-size: 10.5px; fill: #334155; }
  </style>

  <rect width="640" height="300" fill="#ffffff"/>
  <text x="320" y="25" text-anchor="middle" class="t">Où la loi de 1905 ne s’applique pas</text>
  <text x="320" y="43" text-anchor="middle" class="st">la République est laïque — avec deux exceptions, et l’une est outre-mer</text>

  <!-- l'Hexagone -->
  <polygon points="175,62 268,112 258,208 168,246 92,200 84,110"
           fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="150" y="150" text-anchor="middle" class="ok">loi de 1905</text>
  <text x="150" y="164" text-anchor="middle" class="zs">séparation des Églises</text>
  <text x="150" y="176" text-anchor="middle" class="zs">et de l’État</text>
  <text x="176" y="258" text-anchor="middle" class="zs" font-style="italic">l’Hexagone</text>

  <!-- Alsace-Moselle, the north-east corner -->
  <polygon points="238,92 268,112 258,152 232,134" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <line x1="266" y1="120" x2="316" y2="104" stroke="#d97706" stroke-width="1"/>
  <text x="322" y="101" class="zn">Alsace-Moselle</text>
  <text x="322" y="115" class="tag">CONCORDAT DE 1801</text>
  <text x="322" y="129" class="zs">allemande en 1905, donc jamais concernée.</text>
  <text x="322" y="142" class="zs">L’État y paie prêtres, pasteurs et rabbins,</text>
  <text x="322" y="155" class="zs">et la religion s’enseigne à l’école publique.</text>

  <!-- la Corse -->
  <ellipse cx="288" cy="232" rx="13" ry="20" transform="rotate(18 288 232)" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="288" y="270" text-anchor="middle" class="zs">la Corse</text>

  <!-- Guyane, detached -->
  <line x1="306" y1="196" x2="352" y2="196" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="329" y="190" text-anchor="middle" class="zs" font-size="9" fill="#94a3b8">7 000 km</text>
  <rect x="356" y="172" width="70" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="391" y="205" text-anchor="middle" class="zn">Guyane</text>
  <text x="391" y="243" text-anchor="middle" class="zs" font-size="9" fill="#94a3b8">Amérique du Sud</text>
  <text x="430" y="190" class="tag">ORDONNANCE DE 1828</text>
  <text x="430" y="204" class="zs">Une ordonnance royale tient toujours :</text>
  <text x="430" y="217" class="zs">la collectivité paie le clergé catholique.</text>

  <text x="320" y="288" text-anchor="middle" class="ft">Une exception dans l’Hexagone, une outre-mer — la carte de la laïcité n’est pas uniforme.</text>
</svg>

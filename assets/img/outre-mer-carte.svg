  <text x="604.2" y="252.6" text-anchor="end" class="sb">titre XIII</text>
  <circle cx="14" cy="298.5" r="4.5" fill="#2563eb"/>
  <text x="25" y="302" class="lg">art. 73 — la loi française s’applique directement</text>
  <circle cx="300" cy="298.5" r="4.5" fill="#d97706"/>
  <text x="311" y="302" class="lg">art. 74 — statut propre</text>
  <circle cx="440" cy="298.5" r="4.5" fill="#7c3aed"/>
  <text x="451" y="302" class="lg">titre XIII — la Nouvelle-Calédonie</text>
  <text x="14" y="328.0" class="dk">Depuis Paris</text>

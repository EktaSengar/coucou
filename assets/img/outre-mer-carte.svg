  <text x="6" y="199.2" class="oc">ÉQUATEUR</text>
  <text x="266.7" y="273.0" text-anchor="middle" class="oc">ATLANTIQUE</text>
  <text x="458.7" y="273.0" text-anchor="middle" class="oc">OCÉAN INDIEN</text>

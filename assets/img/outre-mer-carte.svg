<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A world map of the French overseas territories. In the Atlantic: Guadeloupe, Martinique and Guyane under article 73, Saint-Martin, Saint-Barthelemy and Saint-Pierre-et-Miquelon under article 74. In the Indian Ocean: Mayotte and La Reunion under article 73. In the Pacific, which wraps round both edges of the map: Wallis-et-Futuna and Polynesie francaise under article 74, and Nouvelle-Caledonie under title 13 of the Constitution. Mainland France is marked in Europe, with Corsica flagged separately as not outre-mer but a special-status authority inside metropolitan France. Below, three distance bars from Paris: 6700 km to Pointe-a-Pitre, 9350 km to Saint-Denis de La Reunion, 15700 km to Papeete.">
  <style>
    .t  { font-size: 17px; font-weight: 800; fill: #0f172a; }
    .st { font-size: 11px; font-style: italic; fill: #64748b; }
    .lb { font-size: 10.5px; font-weight: 700; fill: #0f172a; }
    .sb { font-size: 9px; fill: #64748b; }
    .oc { font-size: 9.5px; font-style: italic; fill: #94a3b8; letter-spacing: .08em; }
    .lg { font-size: 9.5px; fill: #334155; }
    .dk { font-size: 10px; font-weight: 700; fill: #0f172a; }
    .dv { font-size: 10px; fill: #475569; }
  </style>
  <rect width="640" height="396" fill="#ffffff"/>
  <text x="320.0" y="25" text-anchor="middle" class="t">La France est dans trois océans</text>
  <text x="320.0" y="43" text-anchor="middle" class="st">même République, même Constitution — et jusqu’à 15 700 km d’écart</text>
  <rect x="0" y="62" width="640" height="218" fill="#f8fafc"/>

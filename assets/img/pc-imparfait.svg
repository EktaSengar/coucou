<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A diagram contrasting the two French past tenses. A long blue band runs the full width of the picture with an ellipsis at each end, labelled IMPARFAIT, the scenery that lasts, and containing the phrases il pleuvait, il faisait nuit, je dormais. A single amber pin drops into the band from above, labelled PASSÉ COMPOSÉ, le téléphone a sonné — the thing that happens and cuts into the scene. Underneath, the whole sentence: Je dormais quand le téléphone a sonné. Below that, two columns of trigger words: autrefois, à l'époque, d'habitude, tous les jours and pendant que call for the imparfait; soudain, tout à coup, un jour, puis, enfin and trois fois call for the passé composé.">
  <style>
    .t   { font-size: 17px; font-weight: 800; fill: #0f172a; }
    .st  { font-size: 11px; font-style: italic; fill: #64748b; }
    .tag { font-size: 9px; font-weight: 800; letter-spacing: .09em; }
    .ev  { font-size: 12px; font-weight: 800; fill: #0f172a; }
    .bg  { font-size: 11px; fill: #1e3a8a; }
    .lab { font-size: 10px; font-style: italic; fill: #64748b; }
    .sen { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .hd  { font-size: 10px; font-weight: 800; fill: #0f172a; }
    .wd  { font-size: 10px; fill: #334155; }
    .ft  { font-size: 10px; fill: #475569; }
  </style>

  <rect width="640" height="292" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" class="t">Le film et la photo</text>
  <text x="320" y="42" text-anchor="middle" class="st">l’imparfait dure — le passé composé arrive</text>

  <!-- the event that cuts in -->
  <text x="446" y="68" text-anchor="middle" class="tag" fill="#b45309">PASSÉ COMPOSÉ</text>
  <text x="446" y="84" text-anchor="middle" class="ev">le téléphone a sonné</text>

  <!-- the running scene -->
  <rect x="14" y="106" width="612" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="24" y="138" class="bg" fill="#93c5fd">…</text>
  <text x="620" y="138" text-anchor="end" class="bg" fill="#93c5fd">…</text>
  <text x="44" y="126" class="tag" fill="#1d4ed8">IMPARFAIT</text>
  <text x="44" y="140" class="lab">le décor qui dure</text>
  <text x="180" y="136" class="bg">il pleuvait · il faisait nuit · je dormais</text>
  <line x1="446" y1="97" x2="446" y2="168" stroke="#d97706" stroke-width="2"/>
  <circle cx="446" cy="97" r="5.5" fill="#d97706"/>

  <text x="320" y="192" text-anchor="middle" class="sen">« Je dormais quand le téléphone a sonné. »</text>

  <!-- trigger words -->
  <rect x="14" y="208" width="298" height="54" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="32" y="228" class="hd">Ces mots appellent l’imparfait</text>
  <text x="32" y="244" class="wd">autrefois · à l’époque · d’habitude</text>
  <text x="32" y="256" class="wd">tous les jours · pendant que</text>

  <rect x="328" y="208" width="298" height="54" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
  <text x="346" y="228" class="hd">Ces mots appellent le passé composé</text>
  <text x="346" y="244" class="wd">soudain · tout à coup · un jour</text>
  <text x="346" y="256" class="wd">puis · enfin · trois fois</text>

  <text x="320" y="282" text-anchor="middle" class="ft">Dans une histoire, il en faut presque toujours les deux.</text>
</svg>

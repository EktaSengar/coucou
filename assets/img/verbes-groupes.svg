<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" width="640" height="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A decision tree sorting French verbs into three groups. Does it end in -er? If yes and it is not aller, first group. If not, does it end in -ir? If no, third group. If yes, does nous end in -issons? If yes, second group; if no, third group.">
  <defs>
    <marker id="t" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .q     { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .grp   { font-size: 15px; font-weight: 800; }
    .fr    { font-size: 10.5px; font-weight: 600; fill: #64748b; }
    .ex    { font-size: 11.5px; font-style: italic; }
    .yn    { font-size: 11px; font-weight: 800; }
    .flow  { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#t); }
    .merge { fill: none; stroke: #94a3b8; stroke-width: 2; }
    .start { font-size: 13px; font-weight: 700; fill: #334155; }
  </style>

  <rect width="640" height="690" fill="#ffffff"/>

  <!-- start -->
  <rect x="206" y="16" width="228" height="38" rx="19" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="start" x="320" y="40" text-anchor="middle">any French verb, in the infinitive</text>
  <path class="flow" d="M320,54 L320,74"/>

  <!-- ① does it end in -ER? -->
  <rect x="150" y="82" width="340" height="46" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text class="q" x="320" y="111" text-anchor="middle">① Does it end in -ER?</text>

  <path class="flow" d="M150,105 L96,105 L96,150"/>
  <text class="yn" x="122" y="98" text-anchor="middle" fill="#16a34a">YES</text>

  <!-- group 1 -->
  <rect x="16" y="158" width="272" height="104" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text class="grp" x="152" y="184" text-anchor="middle" fill="#15803d">1st group</text>
  <text class="fr"  x="152" y="201" text-anchor="middle">« le 1er groupe »</text>
  <text class="ex"  x="152" y="222" text-anchor="middle" fill="#166534">parler → nous parlons</text>
  <text class="ex"  x="152" y="239" text-anchor="middle" fill="#166534">manger, aimer, regarder…</text>
  <text class="ex"  x="152" y="255" text-anchor="middle" fill="#166534">about 90% of all French verbs</text>

  <path d="M152,262 L152,274" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="16" y="274" width="272" height="46" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="152" y="293" text-anchor="middle" font-size="12" font-weight="800" fill="#b45309">except ALLER</text>
  <text class="ex" x="152" y="310" text-anchor="middle" fill="#92400e">ends in -er, but irregular → 3rd group</text>

  <path class="flow" d="M320,128 L320,340"/>
  <text class="yn" x="344" y="152" text-anchor="middle" fill="#dc2626">NO</text>

  <!-- ② does it end in -IR? — the condition the old diagram left out -->
  <rect x="150" y="346" width="340" height="46" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text class="q" x="320" y="375" text-anchor="middle">② Does it end in -IR?</text>

  <!-- ② NO → straight to the 3rd group -->
  <path class="flow" d="M490,369 L568,369 L568,494"/>
  <text class="yn" x="529" y="362" text-anchor="middle" fill="#dc2626">NO</text>

  <path class="flow" d="M320,392 L320,422"/>
  <text class="yn" x="344" y="412" text-anchor="middle" fill="#16a34a">YES</text>

  <!-- ③ and only now the -issons test -->
  <rect x="122" y="428" width="396" height="56" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <text class="q"  x="320" y="452" text-anchor="middle">③ With « nous », does it end in -ISSONS?</text>
  <text class="ex" x="320" y="472" text-anchor="middle" fill="#64748b">this is where partir and courir drop out</text>

  <path class="flow" d="M122,456 L66,456 L66,494"/>
  <text class="yn" x="94" y="448" text-anchor="middle" fill="#16a34a">YES</text>

  <!-- ③ NO merges into the same route as ② NO -->
  <path class="merge" d="M518,456 L568,456"/>
  <circle cx="568" cy="456" r="3.5" fill="#94a3b8"/>
  <text class="yn" x="541" y="448" text-anchor="middle" fill="#dc2626">NO</text>

  <!-- group 2 -->
  <rect x="16" y="502" width="272" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="grp" x="152" y="528" text-anchor="middle" fill="#1d4ed8">2nd group</text>
  <text class="fr"  x="152" y="545" text-anchor="middle">« le 2e groupe »</text>
  <text class="ex"  x="152" y="566" text-anchor="middle" fill="#1e40af">finir → nous finissons</text>
  <text class="ex"  x="152" y="583" text-anchor="middle" fill="#1e40af">choisir → nous choisissons</text>
  <text class="ex"  x="152" y="599" text-anchor="middle" fill="#1e40af">grandir → nous grandissons</text>

  <!-- group 3 -->
  <rect x="320" y="502" width="304" height="104" rx="12" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="2"/>
  <text class="grp" x="472" y="528" text-anchor="middle" fill="#7c3aed">3rd group — the irregulars</text>
  <text class="fr"  x="472" y="545" text-anchor="middle">« le 3e groupe »</text>
  <text class="ex"  x="472" y="566" text-anchor="middle" fill="#6b21a8">partir → nous partons</text>
  <text class="ex"  x="472" y="583" text-anchor="middle" fill="#6b21a8">courir, venir, prendre,</text>
  <text class="ex"  x="472" y="599" text-anchor="middle" fill="#6b21a8">voir, faire, aller…</text>

  <!-- footer -->
  <rect x="16" y="622" width="608" height="46" rx="10" fill="#fef2f2"/>
  <text x="320" y="642" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">The 2nd group needs BOTH: an -IR ending and -ISSONS at « nous ».</text>
  <text x="320" y="659" text-anchor="middle" font-size="12" fill="#7f1d1d">finir → nous finissons (2nd) · partir → nous partons (3rd). Same -ir, different group.</text>
</svg>

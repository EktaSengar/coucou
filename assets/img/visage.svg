<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="A labelled face: les cheveux, le crâne, le front, le sourcil, l'œil, le nez, l'oreille, la narine, la joue, les lèvres, la bouche, le menton and le cou">
  <style>
    .lbl  { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .en   { font-size: 11px; font-style: italic; fill: #64748b; }
    .lead { stroke: #dc2626; stroke-width: 1.6; fill: none; }
    .dot  { fill: #dc2626; }
  </style>

  <rect width="640" height="500" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Le visage</text>

  <!-- neck & shoulders -->
  <path d="M292,320 L292,372 Q252,384 236,420 L404,420 Q388,384 348,372 L348,320 Z" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- ears -->
  <ellipse cx="234" cy="240" rx="12" ry="20" fill="#fbd3ae" stroke="#e2b48c" stroke-width="1.5"/>
  <ellipse cx="406" cy="240" rx="12" ry="20" fill="#fbd3ae" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- head -->
  <ellipse cx="320" cy="232" rx="88" ry="112" fill="#fde3c8" stroke="#e2b48c" stroke-width="1.5"/>
  <!-- hair -->
  <path d="M232,224 Q228,120 320,120 Q412,120 408,224 Q400,168 366,156 Q330,182 274,166 Q244,178 232,224 Z" fill="#a06a3c"/>
  <!-- eyebrows -->
  <path d="M262,204 Q282,194 302,203" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M338,203 Q358,194 378,204" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="282" cy="226" rx="15" ry="9" fill="#ffffff" stroke="#8a6240" stroke-width="1.5"/>
  <circle cx="282" cy="226" r="5.5" fill="#5b3a1e"/>
  <ellipse cx="358" cy="226" rx="15" ry="9" fill="#ffffff" stroke="#8a6240" stroke-width="1.5"/>
  <circle cx="358" cy="226" r="5.5" fill="#5b3a1e"/>
  <!-- nose + nostrils -->
  <path d="M320,232 L313,272 Q320,277 327,272" stroke="#d9a077" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="309" cy="274" rx="4" ry="2.6" fill="#c98c63"/>
  <ellipse cx="331" cy="274" rx="4" ry="2.6" fill="#c98c63"/>
  <!-- lips / mouth -->
  <path d="M296,302 Q320,294 344,302 Q320,314 296,302 Z" fill="#e08a8a" stroke="#c96b6b" stroke-width="1.5"/>
  <path d="M296,302 Q320,306 344,302" stroke="#b35555" stroke-width="1.4" fill="none"/>

  <!-- ── left-hand labels ─────────────────────────────────────────── -->
  <g text-anchor="end">
    <text class="lbl" x="205" y="96">les cheveux</text>
    <text class="en"  x="205" y="111">the hair</text>
    <path class="lead" d="M211,92 L262,150"/><circle class="dot" cx="262" cy="150" r="3"/>

    <text class="lbl" x="205" y="152">le front</text>
    <text class="en"  x="205" y="167">the forehead</text>
    <path class="lead" d="M211,148 L292,180"/><circle class="dot" cx="292" cy="180" r="3"/>

    <text class="lbl" x="205" y="206">l'œil</text>
    <text class="en"  x="205" y="221">the eye</text>
    <path class="lead" d="M211,202 L267,224"/><circle class="dot" cx="267" cy="224" r="3"/>

    <text class="lbl" x="205" y="258">l'oreille</text>
    <text class="en"  x="205" y="273">the ear</text>
    <path class="lead" d="M211,254 L221,246"/><circle class="dot" cx="221" cy="246" r="3"/>

    <text class="lbl" x="205" y="310">la narine</text>
    <text class="en"  x="205" y="325">the nostril</text>
    <path class="lead" d="M211,306 L304,276"/><circle class="dot" cx="304" cy="276" r="3"/>

    <text class="lbl" x="205" y="362">les lèvres</text>
    <text class="en"  x="205" y="377">the lips</text>
    <path class="lead" d="M211,358 L295,308"/><circle class="dot" cx="295" cy="308" r="3"/>

    <text class="lbl" x="205" y="414">le menton</text>
    <text class="en"  x="205" y="429">the chin</text>
    <path class="lead" d="M211,410 L308,338"/><circle class="dot" cx="308" cy="338" r="3"/>
  </g>

  <!-- ── right-hand labels ────────────────────────────────────────── -->
  <g text-anchor="start">
    <text class="lbl" x="435" y="96">le crâne</text>
    <text class="en"  x="435" y="111">the skull</text>
    <path class="lead" d="M429,92 L372,146"/><circle class="dot" cx="372" cy="146" r="3"/>

    <text class="lbl" x="435" y="158">le sourcil</text>
    <text class="en"  x="435" y="173">the eyebrow</text>
    <path class="lead" d="M429,154 L378,200"/><circle class="dot" cx="378" cy="200" r="3"/>

    <text class="lbl" x="435" y="220">le nez</text>
    <text class="en"  x="435" y="235">the nose</text>
    <path class="lead" d="M429,216 L330,250"/><circle class="dot" cx="330" cy="250" r="3"/>

    <text class="lbl" x="435" y="278">la joue</text>
    <text class="en"  x="435" y="293">the cheek</text>
    <path class="lead" d="M429,274 L378,268"/><circle class="dot" cx="378" cy="268" r="3"/>

    <text class="lbl" x="435" y="340">la bouche</text>
    <text class="en"  x="435" y="355">the mouth</text>
    <path class="lead" d="M429,336 L345,306"/><circle class="dot" cx="345" cy="306" r="3"/>

    <text class="lbl" x="435" y="400">le cou</text>
    <text class="en"  x="435" y="415">the neck</text>
    <path class="lead" d="M429,396 L350,364"/><circle class="dot" cx="350" cy="364" r="3"/>
  </g>

  <!-- the irregular plural, worth its own callout -->
  <rect x="170" y="452" width="300" height="30" rx="15" fill="#fef2f2"/>
  <text x="320" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">un œil → des yeux</text>
</svg>
